# ANUSMITA — Netlify Next.js Runtime (auto-detected)
# This is NOT a static export: App Router and API routes require functions.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  STORE_MODE = "catalog"

# Scheduled publication uses the existing guarded MongoDB connection.
[functions."publish-scheduled"]
  schedule = "*/5 * * * *"


# Extra deploy diagnostics for this PR. Does not change production settings.
[context.deploy-preview.environment]
  NETLIFY_BUILD_DEBUG = "true"
