
name: Quality checks
on:
  push:
    branches: [main, feature/commerce-erp-foundation]
  pull_request:
    branches: [main]
jobs:
  quality:
    # MongoDB 8 currently rejects kernel 6.19+; use the Ubuntu 22.04 runner.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate staging deployment script syntax
        run: node --check scripts/deploy-cloudflare-staging.mjs
      - name: Start isolated Funnel Builder replica set
        run: |
          docker run -d --name funnel-test-mongo -p 127.0.0.1:27018:27017 mongo:8.0 --replSet funnel-test --bind_ip_all
          for attempt in {1..30}; do
            if docker exec funnel-test-mongo mongosh --quiet --eval 'rs.initiate({_id:"funnel-test",members:[{_id:0,host:"localhost:27017"}]})'; then
              break
            fi
            sleep 1
          done
          for attempt in {1..30}; do
            if docker exec funnel-test-mongo mongosh --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Unit and isolated database tests
        run: npm test
        env:
          FUNNEL_TEST_MONGODB_URI: mongodb://127.0.0.1:27018/?directConnection=true&replicaSet=funnel-test
          DASHBOARD_TEST_MONGODB_URI: mongodb://127.0.0.1:27017/anusmita_dashboard_test
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com

  staging-login-smoke:
    # Only trusted same-repository PR #232 branch may deploy this isolated Worker.
    # Never run deployment credentials for fork PRs or unrelated branches.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/cloudflare-recovery' }}
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      ANUSMITA_STAGING: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Check staging credentials exist
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing scoped staging token"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing Cloudflare account ID"; exit 1; }
      - run: npm run typecheck
      - run: npm run build:cloudflare
      - name: Deploy isolated staging only
        run: npm run deploy:cloudflare:staging
      - name: Safe login API checks (no real credentials)
        run: node scripts/verify-staging-auth.mjs
